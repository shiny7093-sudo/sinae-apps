<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF4EA">
<meta name="description" content="작은 웹앱 모음">
<title>신애의 웹앱</title>
<style>
  :root{
    --cream:#FBF4EA; --card:#FFFDF8; --ink:#382A23; --ink-soft:#6F5B4E;
    --ink-faint:#9C8674; --terra:#B85C38; --terra-dark:#8F4225;
    --terra-tint:#F6E3D9; --line:#EADCC8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 60% at 50% -10%,#FFF9F0 0,rgba(255,249,240,0) 60%),var(--cream);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    font-size:16px; line-height:1.55; min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);
  }
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{margin:0 0 22px;color:var(--ink-soft);font-size:14px}
  a.card{
    display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:18px 18px;
    box-shadow:0 6px 22px rgba(120,84,52,.10);margin-bottom:14px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.card:active{transform:scale(.985);box-shadow:0 3px 12px rgba(120,84,52,.12)}
  .badge{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;
    color:var(--terra-dark);background:var(--terra-tint);
    padding:3px 9px;border-radius:999px;margin-bottom:8px
  }
  .name{font-size:17px;font-weight:700;margin:0 0 4px}
  .desc{margin:0;font-size:13.5px;color:var(--ink-soft)}
  .foot{margin-top:26px;text-align:center;font-size:12px;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="wrap">
  <h1>신애의 웹앱</h1>
  <p class="sub">아이폰 사파리에서 열고 <b>공유 → 홈 화면에 추가</b> 하면 앱처럼 쓸 수 있어요.</p>

  <a class="card" href="./this-is-us/">
    <span class="badge">ENGLISH</span>
    <p class="name">This Is Us 영어공부</p>
    <p class="desc">미드 실제 대사로 배우는 관사·시제·억양, 빈칸 퀴즈와 복습장</p>
  </a>

  <a class="card" href="./couple/">
    <span class="badge">OUR HOME</span>
    <p class="name">우리집 부부·육아 허브</p>
    <p class="desc">출산 D-day, 부부 일기, 가계부, 출산 준비 체크리스트 · 4자리 비밀번호로 잠금</p>
  </a>

  <p class="foot">앞으로 쓰는 웹앱도 이곳에 하나씩 추가됩니다.</p>
</div>
</body>
</html>
