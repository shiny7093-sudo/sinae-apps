<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="This Is Us 영어">
<meta name="theme-color" content="#FBF4EA">
<meta name="description" content="미드 This Is Us 시즌1 실제 대사로 배우는 영어 — 관사·시제·억양 포인트, 빈칸 퀴즈, 복습장">
<title>This Is Us 영어공부</title>
<style>
  :root{
    --cream:#FBF4EA;
    --cream-deep:#F4E9DA;
    --card:#FFFDF8;
    --ink:#382A23;
    --ink-soft:#6F5B4E;
    --ink-faint:#9C8674;
    --terra:#B85C38;
    --terra-dark:#8F4225;
    --terra-tint:#F6E3D9;
    --sage:#77855F;
    --sage-tint:#E9EDDF;
    --line:#EADCC8;
    --gold:#C99A3F;
    --radius:20px;
    --shadow:0 6px 22px rgba(120,84,52,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #FFF9F0 0%, rgba(255,249,240,0) 60%),
      var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- header ---------- */
  .top{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--terra);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    margin:6px 0 2px;
    font-size:26px;
    line-height:1.2;
    letter-spacing:-.02em;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:600;
  }
  h1 span{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--terra);
    background:var(--terra-tint);
    border-radius:999px;
    padding:2px 10px 3px;
    vertical-align:middle;
    margin-left:2px;
    letter-spacing:0;
  }
  .tagline{margin:0;color:var(--ink-soft);font-size:13px;}
  .meter{
    margin-top:14px;
    height:7px;
    background:var(--cream-deep);
    border-radius:999px;
    overflow:hidden;
    border:1px solid #F0E3D0;
  }
  .meter i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#D08152,var(--terra));
    border-radius:999px;
    transition:width .35s ease;
  }
  .meter-row{
    display:flex;justify-content:space-between;
    font-size:11.5px;color:var(--ink-faint);
    margin-top:6px;font-variant-numeric:tabular-nums;
  }
  .meter-row b{color:var(--ink-soft);font-weight:600;}

  /* ---------- main ---------- */
  main{flex:1;padding-bottom:104px;}
  .view{display:none;padding:0 20px;}
  .view.on{display:block;animation:fade .28s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- chips ---------- */
  .chips{
    display:flex;gap:8px;overflow-x:auto;
    padding:2px 20px 8px;margin:0 -20px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:999px;
    font-family:inherit;
    transition:all .18s ease;
    cursor:pointer;
  }
  .chip[aria-pressed="true"]{
    background:var(--terra);
    border-color:var(--terra);
    color:#FFF8F2;
    box-shadow:0 3px 10px rgba(184,92,56,.25);
  }
  .chips-label{
    font-size:11px;color:var(--ink-faint);letter-spacing:.04em;
    margin:6px 0 6px;font-weight:700;
  }
  .filter-block{margin-bottom:2px;}

  /* ---------- card ---------- */
  .card{
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,#D6865C,var(--terra-dark));
    opacity:.85;
  }
  .card-top{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:12px;
  }
  .ep{
    font-size:11px;font-weight:700;letter-spacing:.06em;
    color:var(--terra-dark);background:var(--terra-tint);
    border-radius:8px;padding:4px 8px;
  }
  .star{
    border:none;background:transparent;
    font-size:23px;line-height:1;
    color:#D8C6AE;
    padding:6px 10px;margin:-6px -6px -6px 0;
    cursor:pointer;
    transition:transform .18s ease,color .18s ease;
  }
  .star[aria-pressed="true"]{color:var(--gold);transform:scale(1.08);}
  .speaker{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:var(--sage-tint);color:var(--sage);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;flex:0 0 auto;
    border:1px solid #DDE3CE;
  }
  .speaker b{display:block;font-size:14.5px;letter-spacing:-.01em;}
  .speaker small{display:block;font-size:11.5px;color:var(--ink-faint);line-height:1.4;}
  .quote{
    margin:0 0 14px;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
    font-size:19px;
    line-height:1.62;
    letter-spacing:-.005em;
    color:#2E211B;
  }
  .quote .hl{
    background:linear-gradient(180deg,transparent 62%,#F7DFC9 62%);
    padding:0 1px;
  }
  .listen{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .listen-label{font-size:11px;color:var(--ink-faint);margin-right:2px;}
  .btn-speak{
    border:1px solid var(--line);background:#FFF9F1;color:var(--ink-soft);
    font-size:12.5px;font-weight:700;font-family:inherit;
    padding:10px 15px;border-radius:999px;cursor:pointer;
    transition:all .18s ease;
  }
  .btn-speak[aria-pressed="true"]{
    background:var(--sage-tint);border-color:#CBD4B8;color:#5C6B47;
  }
  .divider{height:1px;background:var(--line);margin:14px 0;}

  .sect-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:8px;background:transparent;border:none;padding:6px 0;
    font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);
    cursor:pointer;
  }
  .sect-btn .caret{
    font-size:11px;color:var(--ink-faint);transition:transform .2s ease;
  }
  .sect-btn[aria-expanded="false"] .caret{transform:rotate(-90deg);}
  .ko{
    margin:6px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink-soft);
    background:#FDF7EE;border:1px dashed var(--line);
    border-radius:12px;padding:12px 13px;
  }
  .ko.hide, .points.hide{display:none;}

  .points{padding-top:2px;}
  .pt{
    display:flex;gap:9px;margin-top:11px;
  }
  .pt-tag{
    flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.02em;
    color:var(--terra-dark);background:var(--terra-tint);
    border-radius:6px;padding:3px 7px;height:fit-content;margin-top:2px;
  }
  .pt-tag.g{color:#5C6B47;background:var(--sage-tint);}
  .pt-tag.b{color:#4E6480;background:#E5EBF2;}
  .pt p{margin:0;font-size:13px;line-height:1.65;color:var(--ink-soft);}
  .pt p b{color:var(--ink);font-weight:700;}

  .card-foot{margin-top:16px;display:flex;gap:8px;}
  .btn-done{
    flex:1;border:1px solid var(--terra);background:var(--terra);
    color:#FFF8F2;font-family:inherit;font-size:14px;font-weight:700;
    padding:12px;border-radius:14px;cursor:pointer;
    transition:all .18s ease;
  }
  .btn-done[aria-pressed="true"]{
    background:var(--sage);border-color:var(--sage);
  }
  .card-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin:14px 2px 0;gap:10px;
  }
  .card-nav button{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    font-family:inherit;font-size:13px;font-weight:700;
    padding:11px 16px;border-radius:12px;cursor:pointer;
  }
  .card-nav button:active{background:var(--cream-deep);}
  .card-nav button:disabled{opacity:.35;cursor:default;}
  .counter{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .counter b{color:var(--ink);font-size:13px;}

  .empty{
    text-align:center;padding:44px 18px;color:var(--ink-faint);
    font-size:13.5px;line-height:1.7;
    background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    margin-top:16px;
  }

  /* ---------- quiz ---------- */
  .quiz-head{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;}
  .quiz-head h2{margin:0;font-size:15px;}
  .quiz-head span{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .qcard{
    margin-top:10px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  }
  .qmeta{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.04em;margin-bottom:10px;}
  .qtext{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:18px;line-height:1.6;margin:0 0 16px;
  }
  .blank{
    display:inline-block;min-width:64px;border-bottom:2px solid var(--terra);
    color:var(--terra);text-align:center;
  }
  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{
    text-align:left;font-family:inherit;font-size:14.5px;
    background:#FFFCF7;border:1.5px solid var(--line);
    border-radius:13px;padding:12px 14px;color:var(--ink);
    cursor:pointer;transition:all .16s ease;
    display:flex;align-items:center;gap:10px;
  }
  .opt .k{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;
    background:var(--cream-deep);color:var(--ink-soft);
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .opt.right{background:#EFF3E5;border-color:#A9B892;color:#3F4C30;}
  .opt.right .k{background:#C6D3B0;color:#3F4C30;}
  .opt.wrong{background:#FBEAE3;border-color:#E0A98F;color:#8A3F26;}
  .opt.wrong .k{background:#F0C9B7;color:#8A3F26;}
  .opt:disabled{cursor:default;}
  .explain{
    margin-top:14px;border-radius:13px;padding:13px 14px;
    background:#FDF7EE;border:1px solid var(--line);
    font-size:13px;line-height:1.7;color:var(--ink-soft);
    animation:fade .25s ease;
  }
  .explain b{color:var(--ink);}
  .explain .verdict{display:block;font-size:12px;font-weight:800;margin-bottom:5px;letter-spacing:.02em;}
  .verdict.ok{color:#5C6B47;}
  .verdict.no{color:#A9542F;}
  .explain .full{
    display:block;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
    font-family:"Iowan Old Style",Georgia,serif;font-size:14px;color:var(--ink);
  }
  .btn-next{
    width:100%;margin-top:14px;border:none;background:var(--terra);color:#FFF8F2;
    font-family:inherit;font-size:14.5px;font-weight:700;
    padding:13px;border-radius:14px;cursor:pointer;
  }
  .quiz-intro{
    margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:24px 20px;text-align:center;
    box-shadow:var(--shadow);
  }
  .quiz-intro .big{font-size:34px;line-height:1;}
  .quiz-intro h2{margin:12px 0 6px;font-size:19px;letter-spacing:-.01em;}
  .quiz-intro p{margin:0 0 6px;font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
  .quiz-intro .btn-next{margin-top:18px;}
  .result-score{
    font-family:"Iowan Old Style",Georgia,serif;
    font-size:44px;line-height:1.1;color:var(--terra);margin:6px 0 0;
  }
  .result-score small{font-size:18px;color:var(--ink-faint);}
  .result-msg{font-size:14px;color:var(--ink-soft);margin:8px 0 0;}
  .btn-ghost{
    width:100%;margin-top:10px;background:transparent;border:1px solid var(--line);
    color:var(--ink-soft);font-family:inherit;font-size:13.5px;font-weight:700;
    padding:12px;border-radius:14px;cursor:pointer;
  }

  /* ---------- review ---------- */
  .stats{display:flex;gap:10px;margin-top:16px;}
  .stat{
    flex:1;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 8px;text-align:center;
  }
  .stat b{
    display:block;font-size:22px;line-height:1.2;color:var(--terra-dark);
    font-variant-numeric:tabular-nums;
  }
  .stat span{font-size:11px;color:var(--ink-faint);}
  .rev-title{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:24px 0 10px;
  }
  .rev-title h2{margin:0;font-size:16px;letter-spacing:-.01em;}
  .rev-title span{font-size:12px;color:var(--ink-faint);}
  .fav{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    margin-bottom:10px;overflow:hidden;
  }
  .fav-head{
    width:100%;text-align:left;background:transparent;border:none;
    padding:15px 16px;font-family:inherit;cursor:pointer;display:block;
  }
  .fav-head:active{background:#FDF7EE;}
  .fav-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .fav-top .ep{font-size:10px;padding:3px 7px;}
  .fav-top .who{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .fav-top .unstar{
    margin-left:auto;border:none;background:transparent;color:var(--gold);
    font-size:17px;line-height:1;padding:0 2px;cursor:pointer;
  }
  .fav-quote{
    font-family:"Iowan Old Style",Georgia,serif;font-size:14.5px;line-height:1.55;
    color:#33261F;margin:0;
  }
  .fav-body{padding:0 15px 15px;display:none;}
  .fav.open .fav-body{display:block;animation:fade .22s ease;}
  .fav-body .ko{margin-top:0;}
  .fav-body .points{margin-top:4px;}
  .reset-wrap{margin:26px 0 10px;}
  .note{
    margin-top:18px;font-size:11.5px;line-height:1.7;color:var(--ink-faint);
    border-top:1px solid var(--line);padding-top:14px;
  }

  /* ---------- tabs ---------- */
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    max-width:460px;margin:0 auto;
    background:rgba(255,253,248,.94);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .tabs button{
    flex:1;background:transparent;border:none;font-family:inherit;
    font-size:11px;font-weight:700;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;border-radius:12px;cursor:pointer;
    transition:color .18s ease,background .18s ease;
  }
  .tabs button .ic{font-size:19px;line-height:1;}
  .tabs button[aria-selected="true"]{color:var(--terra-dark);background:var(--terra-tint);}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);z-index:40;
    background:#3B2B22;color:#FFF6EC;font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
    max-width:88%;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="eyebrow">Season 1 · 12 Scenes</div>
    <h1>This Is Us <span>영어공부</span></h1>
    <p class="tagline">레몬 한 문장부터, 하루 한 장면</p>
    <div class="meter"><i id="meterFill"></i></div>
    <div class="meter-row">
      <span id="meterText">0 / 12 학습 완료</span>
      <span id="meterStar">★ 0</span>
    </div>
  </header>

  <main>
    <!-- 학습 -->
    <section class="view on" id="view-learn" aria-label="대사 카드 학습">
      <div class="filter-block">
        <div class="chips-label">에피소드</div>
        <div class="chips" id="epChips"></div>
        <div class="chips-label">인물</div>
        <div class="chips" id="chChips"></div>
      </div>
      <div id="cardHost"></div>
    </section>

    <!-- 퀴즈 -->
    <section class="view" id="view-quiz" aria-label="빈칸 퀴즈">
      <div id="quizHost"></div>
    </section>

    <!-- 복습장 -->
    <section class="view" id="view-review" aria-label="복습장">
      <div class="stats">
        <div class="stat"><b id="stLearned">0</b><span>학습 완료</span></div>
        <div class="stat"><b id="stFav">0</b><span>즐겨찾기</span></div>
        <div class="stat"><b id="stBest">-</b><span>퀴즈 최고</span></div>
      </div>
      <div class="meter" style="margin-top:16px"><i id="revFill"></i></div>
      <div class="meter-row"><span id="revText">전체 진도 0%</span><span>12장면</span></div>

      <div class="rev-title">
        <h2>★ 복습장</h2>
        <span id="favCount">0개</span>
      </div>
      <div id="favList"></div>
      <div class="reset-wrap">
        <button class="btn-ghost" id="resetBtn">학습 기록 초기화</button>
      </div>
      <p class="note">
        대사는 NBC 드라마 &lt;This Is Us&gt; 시즌 1의 실제 방송 대사입니다 (팬 제작 학습용).<br>
        학습 완료·즐겨찾기·퀴즈 최고 점수는 이 브라우저에만 저장됩니다.
      </p>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="learn" aria-selected="true"><span class="ic">📖</span>학습</button>
    <button role="tab" data-tab="quiz" aria-selected="false"><span class="ic">✏️</span>빈칸 퀴즈</button>
    <button role="tab" data-tab="review" aria-selected="false"><span class="ic">★</span>복습장</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============ 데이터: 실제 대사 12개 ============ */
  var QUOTES = [
    {
      id: "dk-lemon",
      ep: 1,
      epTitle: "Pilot",
      speaker: "닥터 K",
      scene: "분만실 복도 · 세 쌍둥이 중 하나를 잃은 잭에게",
      quote: "I like to think that maybe one day you'll be an old man like me, talking a younger man's ear off, explaining to him how you took the sourest lemon that life has to offer and turned it into something resembling lemonade. If you can do that, then you'll still be taking three babies home from this hospital. Just maybe not the way you planned.",

  /* ============ 저장소 ============ */
  var KEY = "tiu-en-study-v1";
  var DEFAULT_STATE = { learned: {}, fav: {}, rate: 1, best: null };
  var S = loadState();

  function loadState() {
    var base = { learned: {}, fav: {}, rate: 1, best: null };
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return base;
      var p = JSON.parse(raw);
      if (!p || typeof p !== "object") return base;
      if (p.learned && typeof p.learned === "object") base.learned = p.learned;
      if (p.fav && typeof p.fav === "object") base.fav = p.fav;
      if (typeof p.rate === "number" && p.rate > 0) base.rate = p.rate;
      if (typeof p.best === "number") base.best = p.best;
      return base;
    } catch (e) {
      return base;
    }
  }
  function saveState() {
    try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ============ 유틸 ============ */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("on");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 1700);
  }
  function richText(s) {
    // 백틱으로 감싼 영어 표현을 굵게 표시합니다.
    var parts = String(s).split("`");
    var out = "";
    for (var i = 0; i < parts.length; i++) {
      out += (i % 2 === 1) ? "<b>" + esc(parts[i]) + "</b>" : esc(parts[i]);
    }
    return out;
  }
  function episodeLabel(q) { return "S1 · E" + q.ep; }
  function byId(id) {
    for (var i = 0; i < QUOTES.length; i++) if (QUOTES[i].id === id) return QUOTES[i];
    return null;
  }
  function learnedCount() { return Object.keys(S.learned).filter(function (k) { return S.learned[k]; }).length; }
  function favCount() { return Object.keys(S.fav).filter(function (k) { return S.fav[k]; }).length; }

  /* ============ 상단 진도 ============ */
  function updateMeters() {
    var total = QUOTES.length;
    var done = learnedCount();
    var pct = total ? Math.round(done / total * 100) : 0;
    $("#meterFill").style.width = pct + "%";
    $("#meterText").textContent = done + " / " + total + " 학습 완료";
    $("#meterStar").textContent = "★ " + favCount();
    $("#stLearned").textContent = done;
    $("#stFav").textContent = favCount();
    $("#stBest").textContent = (S.best === null ? "-" : S.best + "/" + QUIZ.length);
    $("#revFill").style.width = pct + "%";
    $("#revText").textContent = "전체 진도 " + pct + "%";
    $("#favCount").textContent = favCount() + "개";
  }

  /* ============ 탭 ============ */
  var currentTab = "learn";
  function setTab(name) {
    currentTab = name;
    $$(".view").forEach(function (v) { v.classList.remove("on"); });
    var view = $("#view-" + name);
    if (view) view.classList.add("on");
    $$(".tabs button").forEach(function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-tab") === name ? "true" : "false");
    });
    window.scrollTo(0, 0);
    if (name === "review") renderReview();
    if (name === "quiz" && !quizState.started) renderQuizIntro();
  }
  $$(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { setTab(b.getAttribute("data-tab")); });
  });

  /* ============ 학습 탭 ============ */
  var filterEp = "all";
  var filterCh = "all";
  var cardIndex = 0;
  var koOpen = false;
  var pointsOpen = true;

  function episodes() {
    var seen = [];
    QUOTES.forEach(function (q) { if (seen.indexOf(q.ep) === -1) seen.push(q.ep); });
    return seen;
  }
  function speakers() {
    var seen = [];
    QUOTES.forEach(function (q) { if (seen.indexOf(q.speaker) === -1) seen.push(q.speaker); });
    return seen;
  }
  function filtered() {
    return QUOTES.filter(function (q) {
      if (filterEp !== "all" && String(q.ep) !== filterEp) return false;
      if (filterCh !== "all" && q.speaker !== filterCh) return false;
      return true;
    });
  }

  function buildChips() {
    var epHtml = ["<button class=\"chip\" data-act=\"ep\" data-val=\"all\" aria-pressed=\"true\">전체</button>"];
    episodes().forEach(function (e) {
      epHtml.push("<button class=\"chip\" data-act=\"ep\" data-val=\"" + e + "\" aria-pressed=\"false\">E" + e + "</button>");
    });
    $("#epChips").innerHTML = epHtml.join("");

    var chHtml = ["<button class=\"chip\" data-act=\"ch\" data-val=\"all\" aria-pressed=\"true\">전체</button>"];
    speakers().forEach(function (s) {
      chHtml.push("<button class=\"chip\" data-act=\"ch\" data-val=\"" + esc(s) + "\" aria-pressed=\"false\">" + esc(s) + "</button>");
    });
    $("#chChips").innerHTML = chHtml.join("");
  }

  function syncChips() {
    $$("#epChips .chip").forEach(function (c) {
      c.setAttribute("aria-pressed", c.getAttribute("data-val") === filterEp ? "true" : "false");
    });
    $$("#chChips .chip").forEach(function (c) {
      c.setAttribute("aria-pressed", c.getAttribute("data-val") === filterCh ? "true" : "false");
    });
  }

  function pointsHtml(q, small) {
    var out = ["<div class=\"points\">"];
    q.points.forEach(function (p) {
      var cls = "pt-tag" + (p.c ? " " + p.c : "");
      out.push("<div class=\"pt\"><span class=\"" + cls + "\">" + esc(p.t) + "</span><p>" + richText(p.x) + "</p></div>");
    });
    out.push("</div>");
    return out.join("");
  }

  function cardHtml(q) {
    var isFav = !!S.fav[q.id];
    var isDone = !!S.learned[q.id];
    var initial = q.speaker.replace(/\s/g, "").charAt(0);
    var h = [];
    h.push("<article class=\"card\" id=\"curCard\">");
    h.push("  <div class=\"card-top\">");
    h.push("    <span class=\"ep\">" + episodeLabel(q) + " · " + esc(q.epTitle) + "</span>");
    h.push("    <button class=\"star\" data-act=\"star\" aria-pressed=\"" + (isFav ? "true" : "false") + "\" aria-label=\"즐겨찾기\">" + (isFav ? "★" : "☆") + "</button>");
    h.push("  </div>");
    h.push("  <div class=\"speaker\"><span class=\"avatar\">" + esc(initial) + "</span><div><b>" + esc(q.speaker) + "</b><small>" + esc(q.scene) + "</small></div></div>");
    h.push("  <p class=\"quote\">" + esc(q.quote) + "</p>");
    h.push("  <div class=\"listen\"><span class=\"listen-label\">듣기</span>");
    h.push("    <button class=\"btn-speak\" data-act=\"speak\" data-rate=\"0.8\" aria-pressed=\"" + (S.rate === 0.8 ? "true" : "false") + "\">🐢 0.8x</button>");
    h.push("    <button class=\"btn-speak\" data-act=\"speak\" data-rate=\"1\" aria-pressed=\"" + (S.rate === 1 ? "true" : "false") + "\">🔊 1.0x</button>");
    h.push("  </div>");
    h.push("  <div class=\"divider\"></div>");
    h.push("  <button class=\"sect-btn\" data-act=\"ko\" aria-expanded=\"" + (koOpen ? "true" : "false") + "\"><span>한글 해석</span><span class=\"caret\">▾</span></button>");
    h.push("  <p class=\"ko" + (koOpen ? "" : " hide") + "\">" + esc(q.ko) + "</p>");
    h.push("  <div class=\"divider\"></div>");
    h.push("  <button class=\"sect-btn\" data-act=\"points\" aria-expanded=\"" + (pointsOpen ? "true" : "false") + "\"><span>표현 &amp; 문법 포인트 <b style=\"color:#B85C38\">" + q.points.length + "</b></span><span class=\"caret\">▾</span></button>");
    h.push("  <div class=\"points-wrap\"" + (pointsOpen ? "" : " style=\"display:none\"") + ">" + pointsHtml(q) + "</div>");
    h.push("  <div class=\"card-foot\"><button class=\"btn-done\" data-act=\"done\" aria-pressed=\"" + (isDone ? "true" : "false") + "\">" + (isDone ? "✓ 학습 완료" : "학습 완료로 표시") + "</button></div>");
    h.push("</article>");
    return h.join("\n");
  }

  function renderLearn() {
    var list = filtered();
    if (cardIndex > list.length - 1) cardIndex = Math.max(0, list.length - 1);
    if (cardIndex < 0) cardIndex = 0;
    syncChips();

    var host = $("#cardHost");
    if (!list.length) {
      host.innerHTML = "<div class=\"empty\">이 조합에는 아직 대사가 없어요.<br>필터를 '전체'로 바꿔 보세요.</div>";
      updateMeters();
      return;
    }
    var q = list[cardIndex];
    var nav = [];
    nav.push("<div class=\"card-nav\">");
    nav.push("  <button data-act=\"prev\"" + (cardIndex === 0 ? " disabled" : "") + ">◀ 이전</button>");
    nav.push("  <span class=\"counter\"><b>" + (cardIndex + 1) + "</b> / " + list.length + "</span>");
    nav.push("  <button data-act=\"next\"" + (cardIndex === list.length - 1 ? " disabled" : "") + ">다음 ▶</button>");
    nav.push("</div>");
    host.innerHTML = cardHtml(q) + nav.join("");
    updateMeters();
  }

  function go(delta) {
    var list = filtered();
    var next = cardIndex + delta;
    if (next < 0 || next > list.length - 1) return;
    cardIndex = next;
    koOpen = false;
    renderLearn();
  }

  /* 음성 */
  function pickVoice() {
    if (!window.speechSynthesis) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    var best = null;
    for (var i = 0; i < vs.length; i++) {
      var v = vs[i];
      var lang = v.lang || "";
      if (lang.indexOf("en-US") !== 0) continue;
      if (!best) best = v;
      var name = v.name || "";
      if (/Samantha|Alex|Google US English|Ava|Allison|Susan/i.test(name)) return v;
    }
    if (!best) {
      for (var j = 0; j < vs.length; j++) {
        if ((vs[j].lang || "").indexOf("en") === 0) return vs[j];
      }
    }
    return best;
  }
  var voicesPrimed = false;
  function speak(text, rate) {
    if (!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance !== "function") {
      toast("이 브라우저는 음성 듣기를 지원하지 않아요.");
      return;
    }
    try {
      window.speechSynthesis.cancel();
      var u = new window.SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = rate || 1;
      var v = pickVoice();
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {
      toast("음성을 재생할 수 없어요.");
    }
  }

  /* 학습 탭 이벤트 (위임) */
  $("#view-learn").addEventListener("click", function (ev) {
    var t = ev.target;
    var btn = t.closest ? t.closest("[data-act]") : null;
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    var list = filtered();
    var q = list[cardIndex];

    if (act === "ep") {
      filterEp = btn.getAttribute("data-val");
      cardIndex = 0; koOpen = false;
      renderLearn();
      return;
    }
    if (act === "ch") {
      filterCh = btn.getAttribute("data-val");
      cardIndex = 0; koOpen = false;
      renderLearn();
      return;
    }
    if (!q) return;

    if (act === "star") {
      S.fav[q.id] = !S.fav[q.id];
      if (!S.fav[q.id]) delete S.fav[q.id];
      saveState();
      btn.setAttribute("aria-pressed", S.fav[q.id] ? "true" : "false");
      btn.textContent = S.fav[q.id] ? "★" : "☆";
      toast(S.fav[q.id] ? "복습장에 담았어요" : "복습장에서 뺐어요");
      updateMeters();
      if (currentTab === "review") renderReview();
      return;
    }
    if (act === "speak") {
      var rate = parseFloat(btn.getAttribute("data-rate"));
      S.rate = rate; saveState();
      $$("#view-learn .btn-speak").forEach(function (b) {
        b.setAttribute("aria-pressed", parseFloat(b.getAttribute("data-rate")) === rate ? "true" : "false");
      });
      speak(q.quote, rate);
      return;
    }
    if (act === "ko") {
      koOpen = !koOpen;
      btn.setAttribute("aria-expanded", koOpen ? "true" : "false");
      var koEl = $("#curCard .ko");
      if (koEl) koEl.classList.toggle("hide", !koOpen);
      return;
    }
    if (act === "points") {
      pointsOpen = !pointsOpen;
      btn.setAttribute("aria-expanded", pointsOpen ? "true" : "false");
      var wrap = $("#curCard .points-wrap");
      if (wrap) wrap.style.display = pointsOpen ? "" : "none";
      return;
    }
    if (act === "done") {
      var now = !S.learned[q.id];
      if (now) S.learned[q.id] = true; else delete S.learned[q.id];
      saveState();
      btn.setAttribute("aria-pressed", now ? "true" : "false");
      btn.textContent = now ? "✓ 학습 완료" : "학습 완료로 표시";
      toast(now ? "학습 완료로 기록했어요" : "학습 표시를 해제했어요");
      updateMeters();
      if (currentTab === "review") renderReview();
      return;
    }
    if (act === "prev") { go(-1); return; }
    if (act === "next") { go(1); return; }
  });

  /* 스와이프 */
  var tStartX = null, tStartY = null;
  var host = $("#cardHost");
  host.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { tStartX = null; return; }
    tStartX = e.touches[0].clientX;
    tStartY = e.touches[0].clientY;
  }, { passive: true });
  host.addEventListener("touchend", function (e) {
    if (tStartX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - tStartX;
    var dy = t.clientY - tStartY;
    tStartX = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50) {
      go(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  /* ============ 퀴즈 탭 ============ */
  var quizState = { started: false, order: [], items: [], idx: 0, score: 0, picked: -1, done: false };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function renderQuizIntro() {
    quizState.started = false;
    quizState.order = [];
    quizState.items = [];
    quizState.idx = 0;
    quizState.score = 0;
    quizState.picked = -1;
    quizState.done = false;
    var bestTxt = (S.best === null) ? "아직 기록이 없어요" : "최고 " + S.best + "/" + QUIZ.length;
    $("#quizHost").innerHTML =
      "<div class=\"quiz-intro\">" +
      "  <div class=\"big\">✏️</div>" +
      "  <h2>빈칸 퀴즈</h2>" +
      "  <p>12개 장면의 실제 대사에서<br>관사·시제·표현을 골라냈어요.</p>" +
      "  <p style=\"color:#9C8674;font-size:12.5px\">" + bestTxt + "</p>" +
      "  <button class=\"btn-next\" data-qact=\"start\">12문제 시작하기</button>" +
      "</div>";
  }

  function startQuiz() {
    quizState.started = true;
    quizState.order = shuffle(QUIZ.map(function (_, i) { return i; }));
    // 문제 순서와 보기 순서를 매번 섞어 정답 위치가 드러나지 않게 합니다.
    quizState.items = quizState.order.map(function (qi) {
      var opts = QUIZ[qi].options.map(function (o, i) { return { text: o, i: i }; });
      return { qi: qi, opts: shuffle(opts) };
    });
    quizState.idx = 0;
    quizState.score = 0;
    quizState.picked = -1;
    quizState.done = false;
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var item = quizState.items[quizState.idx];
    var qitem = QUIZ[item.qi];
    var q = byId(qitem.qid);
    var label = q ? (episodeLabel(q) + " · " + q.speaker) : "S1";
    var h = [];
    h.push("<div class=\"quiz-head\"><h2>빈칸 퀴즈</h2><span>" + (quizState.idx + 1) + " / " + QUIZ.length + " · 정답 " + quizState.score + "</span></div>");
    h.push("<div class=\"qcard\">");
    h.push("  <div class=\"qmeta\">" + esc(label) + "</div>");
    h.push("  <p class=\"qtext\">" + esc(qitem.text).replace("_____", "<span class=\"blank\">?</span>") + "</p>");
    h.push("  <div class=\"opts\">");
    item.opts.forEach(function (op, pos) {
      h.push("    <button class=\"opt\" data-qact=\"pick\" data-i=\"" + pos + "\"><span class=\"k\">" + "ABCD".charAt(pos) + "</span><span>" + esc(op.text) + "</span></button>");
    });
    h.push("  </div>");
    h.push("  <div id=\"explainHost\"></div>");
    h.push("</div>");
    $("#quizHost").innerHTML = h.join("\n");
  }

  function answerQuiz(pick) {
    if (quizState.picked !== -1) return;
    var item = quizState.items[quizState.idx];
    var qitem = QUIZ[item.qi];
    var q = byId(qitem.qid);
    var chosen = item.opts[pick].i;
    var correct = (chosen === qitem.answer);
    quizState.picked = pick;
    if (correct) quizState.score += 1;

    $$("#quizHost .opt").forEach(function (b) {
      var pos = parseInt(b.getAttribute("data-i"), 10);
      var orig = item.opts[pos].i;
      b.disabled = true;
      if (orig === qitem.answer) b.classList.add("right");
      else if (pos === pick) b.classList.add("wrong");
    });

    var verdict = correct ? "정답이에요" : "아쉬워요, 정답은 " + qitem.options[qitem.answer];
    var full = q ? q.quote : "";
    $("#explainHost").innerHTML =
      "<div class=\"explain\">" +
      "  <span class=\"verdict " + (correct ? "ok" : "no") + "\">" + esc(verdict) + "</span>" +
      "  " + richText(qitem.why) +
      (full ? "<span class=\"full\">" + esc(full) + "</span>" : "") +
      "</div>" +
      "<button class=\"btn-next\" data-qact=\"next\">" + (quizState.idx === QUIZ.length - 1 ? "결과 보기" : "다음 문제") + "</button>";

    var head = $(".quiz-head span");
    if (head) head.textContent = (quizState.idx + 1) + " / " + QUIZ.length + " · 정답 " + quizState.score;
  }

  function nextQuiz() {
    if (quizState.idx === QUIZ.length - 1) {
      quizState.done = true;
      renderQuizResult();
      return;
    }
    quizState.idx += 1;
    quizState.picked = -1;
    renderQuizQuestion();
  }

  function renderQuizResult() {
    var score = quizState.score;
    var total = QUIZ.length;
    var pct = Math.round(score / total * 100);
    var msg;
    if (score === total) msg = "12개 장면 전부 정답이에요. 이제 복습장에서 소리 내어 읽어 보세요.";
    else if (pct >= 75) msg = "좋아요. 틀린 문장은 복습장에 담아 두고 내일 다시 보면 완벽해져요.";
    else if (pct >= 50) msg = "절반은 잡았어요. 관사와 시제 포인트를 카드에서 한 번 더 확인해 보세요.";
    else msg = "괜찮아요. 학습 탭에서 대사를 한 번 듣고 다시 풀면 금방 올라가요.";
    var isBest = (S.best === null || score > S.best);
    if (isBest) { S.best = score; saveState(); }
    $("#quizHost").innerHTML =
      "<div class=\"quiz-intro\">" +
      "  <div class=\"big\">🍋</div>" +
      "  <h2>점수 확인</h2>" +
      "  <p class=\"result-score\">" + score + " <small>/ " + total + "</small></p>" +
      "  <p class=\"result-msg\">" + esc(msg) + "</p>" +
      (isBest ? "<p class=\"result-msg\" style=\"color:#B85C38;font-weight:700\">최고 기록을 세웠어요!</p>" : "") +
      "  <button class=\"btn-next\" data-qact=\"retry\">다시 풀기</button>" +
      "  <button class=\"btn-ghost\" data-qact=\"toreview\">복습장 보러 가기</button>" +
      "</div>";
    updateMeters();
  }

  $("#view-quiz").addEventListener("click", function (ev) {
    var t = ev.target;
    var btn = t.closest ? t.closest("[data-qact]") : null;
    if (!btn) return;
    var act = btn.getAttribute("data-qact");
    if (act === "start") { startQuiz(); return; }
    if (act === "pick") { answerQuiz(parseInt(btn.getAttribute("data-i"), 10)); return; }
    if (act === "next") { nextQuiz(); return; }
    if (act === "retry") { startQuiz(); return; }
    if (act === "toreview") { setTab("review"); return; }
  });

  /* ============ 복습장 ============ */
  var openFav = {};

  function renderReview() {
    updateMeters();
    var favs = QUOTES.filter(function (q) { return !!S.fav[q.id]; });
    var host = $("#favList");
    if (!favs.length) {
      host.innerHTML = "<div class=\"empty\">아직 담아 둔 대사가 없어요.<br>학습 카드에서 ☆를 눌러 복습장에 담아 보세요.</div>";
      return;
    }
    var h = [];
    favs.forEach(function (q) {
      var isOpen = !!openFav[q.id];
      h.push("<div class=\"fav" + (isOpen ? " open" : "") + "\" data-id=\"" + q.id + "\">");
      h.push("  <div class=\"fav-head\" role=\"button\" tabindex=\"0\" data-ract=\"toggle\" data-id=\"" + q.id + "\">");
      h.push("    <div class=\"fav-top\"><span class=\"ep\">" + episodeLabel(q) + "</span><span class=\"who\">" + esc(q.speaker) + "</span><span class=\"unstar\" data-ract=\"unfav\" data-id=\"" + q.id + "\" role=\"button\" aria-label=\"즐겨찾기 해제\">★</span></div>");
      h.push("    <p class=\"fav-quote\">" + esc(q.quote) + "</p>");
      h.push("  </div>");
      h.push("  <div class=\"fav-body\">");
      h.push("    <p class=\"ko\">" + esc(q.ko) + "</p>");
      h.push("    " + pointsHtml(q));
      h.push("  </div>");
      h.push("</div>");
    });
    host.innerHTML = h.join("\n");
  }

  $("#favList").addEventListener("click", function (ev) {
    var t = ev.target;
    var el = t.closest ? t.closest("[data-ract]") : null;
    if (!el) return;
    var act = el.getAttribute("data-ract");
    var id = el.getAttribute("data-id");
    if (act === "unfav") {
      ev.stopPropagation();
      delete S.fav[id];
      saveState();
      toast("복습장에서 뺐어요");
      renderReview();
      return;
    }
    if (act === "toggle") {
      openFav[id] = !openFav[id];
      var box = t.closest(".fav");
      if (box) box.classList.toggle("open", !!openFav[id]);
      return;
    }
  });

  $("#resetBtn").addEventListener("click", function () {
    var ok = window.confirm("학습 완료·즐겨찾기·퀴즈 최고 점수를 모두 지울까요? 이 브라우저의 기록만 지워집니다.");
    if (!ok) return;
    S = { learned: {}, fav: {}, rate: S.rate, best: null };
    saveState();
    openFav = {};
    renderLearn();
    renderReview();
    renderQuizIntro();
    toast("학습 기록을 초기화했어요");
  });

  /* ============ 시작 ============ */
  buildChips();
  renderLearn();
  updateMeters();
  if (window.speechSynthesis) {
    // iOS는 첫 사용자 터치 전에는 음성 목록이 비어 있을 수 있어 미리 불러옵니다.
    window.speechSynthesis.getVoices();
    if (typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
      window.speechSynthesis.onvoiceschanged = function () { voicesPrimed = true; };
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && window.speechSynthesis) window.speechSynthesis.cancel();
  });
})();
</script>
</body>
</html>
