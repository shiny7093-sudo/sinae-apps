<style>
:root{
  color-scheme:light;
  --bg:#FFF8F2;
  --bg-deep:#FDF1E7;
  --card:#FFFFFF;
  --ink:#3B322C;
  --ink-soft:#5C4F46;
  --muted:#7F6B5D;
  --line:#F1E3D7;
  --accent:#D97757;
  --accent-deep:#B85B3C;
  --accent-soft:#FBE7DC;
  --sage:#7C9A76;
  --sage-soft:#EAF2E5;
  --gold:#E0A458;
  --pink:#C08497;
  --blue:#8B9DC3;
  --shadow:0 6px 18px rgba(126,92,68,.07);
  --shadow-lg:0 12px 34px rgba(126,92,68,.13);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(120% 60% at 100% 0%, #FDEBE0 0%, rgba(253,235,224,0) 60%),
    radial-gradient(100% 50% at 0% 10%, #F4F7EF 0%, rgba(244,247,239,0) 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
input[type="date"]{-webkit-appearance:none;appearance:none;min-height:48px}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
.app{max-width:480px;margin:0 auto;position:relative;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) 18px 10px;
  background:rgba(255,248,242,.86);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(241,227,215,.7);
}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,#E68B67,#D2664A);
  display:grid;place-items:center;font-size:18px;color:#fff;
  box-shadow:0 4px 10px rgba(210,102,74,.28);
}
.brand-title{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;font-size:17px;
  color:var(--ink-soft);box-shadow:0 2px 6px rgba(126,92,68,.06);
}
.icon-btn:active{transform:scale(.95)}

main{padding:14px 16px calc(96px + var(--safe-b))}
.view{display:none}
.view.active{display:block;animation:viewIn .26s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px;
}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 2px 10px}
.section-head h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.section-head p{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.link-btn{
  border:0;background:transparent;color:var(--accent-deep);font-size:12.5px;font-weight:700;
  padding:6px 2px;
}

/* hero */
.hero{
  position:relative;overflow:hidden;
  border-radius:24px;padding:18px 18px 16px;margin-bottom:12px;
  background:linear-gradient(150deg,#D9784F 0%,#C2603F 52%,#AE5238 100%);
  color:#fff;box-shadow:0 14px 30px rgba(174,82,56,.3);text-shadow:0 1px 2px rgba(110,45,25,.16);
}
.hero::after{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  right:-60px;top:-90px;background:rgba(255,255,255,.14);
}
.hero::before{
  content:"";position:absolute;width:120px;height:120px;border-radius:50%;
  left:-40px;bottom:-70px;background:rgba(255,255,255,.10);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hero-pill{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:999px;letter-spacing:-.01em}
.hero-date{font-size:11.5px;font-weight:600;opacity:.9}
.hero-main{display:flex;align-items:baseline;gap:8px;margin-top:10px;position:relative;z-index:1}
.hero-dday{font-size:42px;font-weight:900;letter-spacing:-.04em;line-height:1}
.hero-dday small{font-size:15px;font-weight:700;opacity:.9;letter-spacing:0}
.hero-sub{font-size:12.5px;margin-top:8px;opacity:.95;position:relative;z-index:1;font-weight:600}
.hero-sub b{font-weight:800}
.hero-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden;position:relative;z-index:1}
.hero-bar span{display:block;height:100%;border-radius:99px;background:#fff;opacity:.92}
.hero-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.24);
  font-size:12px;font-weight:600;position:relative;z-index:1;opacity:.98;
}
.hero-foot b{font-weight:800}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{
  text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;
  padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;
  min-height:96px;color:var(--ink);
}
.stat:active{transform:scale(.985)}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.stat-value{font-size:19px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.stat-value small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
.stat-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.wide{grid-column:1 / -1;min-height:auto}
.ring-mini{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--sage) calc(var(--p) * 1%), #EDE4DB 0);
}
.ring-mini i{width:26px;height:26px;border-radius:50%;background:#fff;display:block}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{
  border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--ink-soft);box-shadow:var(--shadow);
}
.quick button:active{transform:scale(.96)}
.quick .q-ico{font-size:20px}

.tip{
  display:flex;gap:10px;align-items:flex-start;
  background:#FFF3E9;border:1px dashed #EFCDB8;border-radius:16px;padding:11px 12px;
  font-size:12px;color:#8A6248;line-height:1.45;margin-bottom:12px;
}
.tip button{margin-left:auto;border:0;background:transparent;color:#B08A70;font-size:15px;padding:0 2px}
.tip b{font-weight:800}

/* segmented */
.seg{display:flex;gap:4px;background:#F6ECE3;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{
  flex:1;border:0;background:transparent;border-radius:11px;padding:9px 4px;
  font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;
}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(126,92,68,.12)}
.seg.compact{display:inline-flex;margin:0;padding:3px}
.seg.compact button{padding:7px 12px;font-size:12px}

.search{position:relative;margin-bottom:12px}
.search input{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;
  padding:12px 14px 12px 38px;font-size:14px;box-shadow:var(--shadow);outline:none;
}
.search input:focus{border-color:#E9BFA9;box-shadow:0 0 0 3px rgba(217,119,87,.12)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}

/* diary */
.diary-list{display:flex;flex-direction:column;gap:10px}
.diary-card{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 15px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.diary-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent-soft)}
.diary-card.baby::before{background:#F6D9C8}
.diary-card.couple::before{background:#EFD3DE}
.diary-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:#fff;flex:none;
}
.avatar.wife{background:#D97757}
.avatar.husband{background:#7C9A76}
.diary-meta{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.diary-meta .who{font-size:12px;font-weight:800}
.diary-meta .when{font-size:10.5px;color:var(--muted);font-weight:600}
.badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:#B4532F;white-space:nowrap}
.badge.couple{background:#FBE7EE;color:#A85D77}
.badge.baby{background:#FDEEE3;color:#B0703C}
.diary-card h3{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:2px 0 5px}
.diary-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.62;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.diary-card.open p{-webkit-line-clamp:unset;display:block}
.diary-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px dashed #F4E8DD}
.mood{font-size:11px;font-weight:700;color:#8B6A55;background:#FBF1E8;border-radius:999px;padding:3px 9px}
.more-btn{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;padding:2px 0}
.del-btn{border:0;background:transparent;color:#C0AA9A;font-size:14px;padding:4px 6px;border-radius:8px}
.del-btn.armed{background:#FDECEC;color:#C05050;font-size:11px;font-weight:800;padding:5px 9px}

/* money */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-nav strong{font-size:16px;font-weight:800;letter-spacing:-.02em}
.month-nav button{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;
  font-size:16px;color:var(--ink-soft);display:grid;place-items:center;
}
.money-card{
  background:linear-gradient(160deg,#FFFDFB,#FFF6EF);
  border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;
}
.money-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.money-row .m{border-right:1px solid #F3E6DB}
.money-row .m:last-child{border-right:0}
.money-row span{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.money-row b{font-size:15px;font-weight:900;letter-spacing:-.03em}
.money-row b.pos{color:#4F7B52}
.money-row b.neg{color:#C05050}
.money-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;font-weight:600}

.cat-bars{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.cat-bar-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px}
.cat-bar-top span:last-child{color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:99px;background:#F4E9DF;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}
.who-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.who-chip{font-size:11px;font-weight:700;background:#FBF2E9;color:#8B6A55;padding:4px 9px;border-radius:999px}

.entry-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.entry{
  display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:11px 12px;box-shadow:var(--shadow);
}
.entry-ico{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none;
  background:#FBF1E8;
}
.entry-mid{flex:1;min-width:0}
.entry-mid b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-mid span{font-size:10.5px;color:var(--muted);font-weight:600}
.entry-amt{font-size:13.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.entry-amt.exp{color:#B4583C}
.entry-amt.inc{color:#4F7B52}

/* prep */
.prep-hero{display:flex;gap:16px;align-items:center}
.ring{
  width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), #F3E6DA 0);
}
.ring i{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal}
.ring b{font-size:19px;font-weight:900;letter-spacing:-.03em}
.ring b small{font-size:10px;font-weight:700;color:var(--muted)}
.prep-hero-info{flex:1;min-width:0}
.prep-hero-info h3{font-size:15px;font-weight:800;margin-bottom:3px}
.prep-hero-info p{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.mini-bars{display:flex;flex-direction:column;gap:6px}
.mini-bar{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;color:var(--ink-soft)}
.mini-bar .bar{flex:1;height:6px}
.mini-bar em{font-style:normal;color:var(--muted);font-size:10px;min-width:32px;text-align:right}

.prep-cat{margin-bottom:14px}
.prep-cat-head{display:flex;align-items:center;gap:8px;margin:0 2px 7px}
.prep-cat-head h3{font-size:14px;font-weight:800;flex:1}
.prep-cat-head span{font-size:11.5px;color:var(--muted);font-weight:700}
.prep-list{display:flex;flex-direction:column;gap:6px}
.prep-item{
  display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:10px 11px;box-shadow:0 2px 8px rgba(126,92,68,.05);
}
.prep-item.done{background:#FCFDF9;border-color:#E4EEDD}
.prep-item.done .prep-text{color:#A9BBA1;text-decoration:line-through}
.check{
  width:23px;height:23px;border-radius:50%;border:2px solid #E6D5C7;background:#fff;
  flex:none;display:grid;place-items:center;color:transparent;font-size:12px;font-weight:900;
  margin-top:1px;
}
.prep-item.done .check{background:var(--sage);border-color:var(--sage);color:#fff}
.prep-text{flex:1;font-size:13px;line-height:1.45;color:var(--ink);word-break:keep-all}
.assignee{
  font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none;
  background:#F3F6F0;color:#6E8A67;margin-top:1px;
}
.assignee.wife{background:#FBEDE6;color:#B4653F}
.assignee.husband{background:#ECF1E8;color:#5F7F58}
.assignee.both{background:#F3EEE9;color:#8B7363}
.add-item{
  width:100%;border:1px dashed #E7D3C4;background:#FFFCF9;border-radius:13px;
  padding:9px;font-size:12px;font-weight:700;color:#B08A70;margin-top:6px;
}

/* places */
.dice{
  width:100%;border:0;border-radius:18px;padding:15px;color:#fff;font-size:15px;font-weight:800;
  background:linear-gradient(135deg,#8FA98A,#6F8D6A);box-shadow:0 10px 22px rgba(111,141,106,.28);
  display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px;
  letter-spacing:-.02em;
}
.dice:active{transform:scale(.985)}
.dice.shake .dice-emoji{animation:diceShake .6s ease}

    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? 'JSON을 복사했어요' : '복사가 막혀 있어요. 아래 칸의 JSON을 직접 복사해 주세요.');
    if (!ok) showBackupText(text);
  }

  function showBackupText(text) {
    openSheet(
      sheetHead('백업 JSON', '전체 선택해서 복사한 뒤 메모·메일·카톡으로 보내 두세요.') +
      '<div class="field"><label for="backupText">백업 데이터</label>' +
      '<textarea id="backupText" readonly style="min-height:220px;font-size:12px">' + esc(text) + '</textarea></div>' +
      '<button class="primary-btn" data-action="close-sheet">닫기</button>'
    );
  }

  function exportFile() {
    var json = JSON.stringify(buildBackup(), null, 2);
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '우리집-백업-' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 4000);
      toast('백업 파일을 내보냈어요');
    } catch (e) {
      copyText(json);
    }
  }

  function stageImportText(text) {
    lastImportText = String(text || '');
    var obj;
    try {
      obj = JSON.parse(lastImportText);
    } catch (e) {
      toast('JSON 형식이 아니에요. 백업 파일 내용을 그대로 붙여넣어 주세요.');
      return;
    }
    var data = obj && obj.data && !obj.diaries ? obj.data : obj;
    var hasData = data && typeof data === 'object' && ['diaries', 'expenses', 'prep', 'places'].some(function (k) {
      return Array.isArray(data[k]);
    });
    if (!hasData) {
      toast('이 JSON에는 일기·가계부 같은 기록이 없어요.');
      return;
    }
    var normalized = normalizeData(data);
    if (!normalized) {
      toast('불러올 데이터를 찾지 못했어요.');
      return;
    }
    pendingImport = normalized;
    renderSettings(true);
  }

  function applyImport() {
    if (!pendingImport) return;
    state = pendingImport;
    pendingImport = null;
    budgetMonth = todayStr().slice(0, 7);
    placesTab = 'date';
    lastPick = null;
    diaryFilter = 'all';
    diaryQuery = '';
    save();
    renderAll();
    closeSheet();

  }

  /* ---------------- 계산 ---------------- */

  function pregnancyInfo() {
    var due = parseYmd(state.settings.dueDate);
    if (!due) return null;
    var today = parseYmd(todayStr());
    var left = Math.round((due.getTime() - today.getTime()) / 86400000);
    var total = 280;
    var elapsed = total - left;
    if (left < 0) {
      return { phase: 'after', left: left, days: Math.abs(left), weeks: 0, wdays: 0, pct: 100 };
    }
    if (elapsed < 0) {
      return { phase: 'before', left: left, weeks: 0, wdays: 0, pct: 0 };
    }
    var weeks = Math.floor(elapsed / 7);
    var wdays = elapsed % 7;
    return {
      phase: 'pregnant', left: left, weeks: weeks, wdays: wdays,
      pct: Math.max(0, Math.min(100, Math.round(elapsed / total * 100)))
    };
  }

  function anniversaryInfo() {
    var w = parseYmd(state.settings.weddingDate);
    if (!w) return null;
    var t = new Date();
    t.setHours(0, 0, 0, 0);
    var year = t.getFullYear();
    var next = new Date(year, w.getMonth(), w.getDate());
    if (next.getTime() < t.getTime()) {
      year += 1;
      next = new Date(year, w.getMonth(), w.getDate());
    }
    var days = Math.round((next.getTime() - t.getTime()) / 86400000);
    return { days: days, years: year - w.getFullYear(), date: ymd(next) };
  }

  function monthEntries(key) {
    return state.expenses.filter(function (e) { return String(e.date).slice(0, 7) === key; });
  }

  function expenseTotal(list) {
    return sumBy(list.filter(function (e) { return e.type === 'expense'; }), function (e) { return e.amount; });
  }
  function incomeTotal(list) {
    return sumBy(list.filter(function (e) { return e.type === 'income'; }), function (e) { return e.amount; });
  }

  function prepStats() {
    var total = state.prep.length;
    var done = state.prep.filter(function (i) { return i.done; }).length;
    return { total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
  }

  function whoLabel(w) {
    if (w === 'wife') return state.settings.wife;
    if (w === 'husband') return state.settings.husband;
    return '함께';
  }
  function assigneeLabel(w) {
    if (w === 'wife') return state.settings.wife;
    if (w === 'husband') return state.settings.husband;
    return '함께';
  }
  function authorLabel(a) { return a === 'husband' ? state.settings.husband : state.settings.wife; }

      id: uid('d'),
      type: draft.diary.type === 'baby' ? 'baby' : 'couple',
      author: draft.diary.author === 'husband' ? 'husband' : 'wife',
      date: date,
      mood: draft.diary.mood || 'happy',
      title: title || '(제목 없음)',
      body: body,
      createdAt: new Date().toISOString(),
      sample: false
    });

  /* ---------------- BUDGET ---------------- */

  function renderBudget() {
    var list = monthEntries(budgetMonth);
    var exp = expenseTotal(list);
    var inc = incomeTotal(list);
    var bal = inc - exp;
    var prevExp = expenseTotal(monthEntries(prevMonthKey(budgetMonth)));

    var byCat = EXP_CATS.filter(function (c) { return c.key !== 'income'; }).map(function (c) {
      return { cat: c, total: sumBy(list.filter(function (e) { return e.type === 'expense' && e.cat === c.key; }), function (e) { return e.amount; }) };
    }).filter(function (x) { return x.total > 0; });

    var byWho = ['wife', 'husband', 'both'].map(function (w) {
      return { who: w, total: sumBy(list.filter(function (e) { return e.type === 'expense' && e.who === w; }), function (e) { return e.amount; }) };

  function pickRandom() {
    var pool = state.places.filter(function (p) { return p.cat === placesTab; });
    if (!pool.length) {
      toast(findPlaceCat(placesTab).label + ' 후보를 먼저 추가해 주세요');
      return;
    }
    var unvisited = pool.filter(function (p) { return !p.visited; });
    var list = unvisited.length ? unvisited : pool;
    var chosen = list[Math.floor(Math.random() * list.length)];
    lastPick = chosen.id;
    renderPlaces();
    var dice = $('diceBtn');
    if (dice) {
      dice.classList.remove('shake');
      void dice.offsetWidth;
      dice.classList.add('shake');
    }
    toast(unvisited.length ? '안 가본 곳에서 골랐어요' : '후보 중에서 골랐어요');
  }

        '<p class="set-desc">일기 ' + previewCounts.diaries + '편 · 가계부 ' + previewCounts.expenses + '건 · 준비 ' + previewCounts.prep + '개 · 장소 ' + previewCounts.places + '개<br>지금 폰에 있는 기록은 이 내용으로 바뀝니다.</p>' +
        '<button class="primary-btn" data-action="import-apply">이 데이터로 바꾸기</button>' +
        '<button class="ghost-btn" data-action="import-cancel">취소</button>' +
      '</div>';
    }

    html += '<hr class="divider">' +
      '<p class="set-title">데이터 정리</p>' +
      '<p class="set-desc">예시로 넣어 둔 일기·가계부·준비·장소만 지워요. 직접 추가한 기록은 그대로 남습니다.</p>' +
      '<button class="ghost-btn" data-action="clear-samples" data-armed="0">🌿 예시 데이터만 지우기</button>' +
      '<button class="ghost-btn warn" data-action="clear-all" data-armed="0">⚠️ 모든 기록 지우기 (설정은 유지)</button>' +
      '<hr class="divider">' +
      '<p class="set-title">📱 아이폰 홈 화면에 앱처럼 두기</p>' +
      '<p class="set-desc">사파리에서 이 파일을 연 뒤 <b>공유 → 홈 화면에 추가</b>를 누르면, 주소창 없이 전체 화면으로 열려요. 병찬 님 폰에도 같은 방법으로 두고, 위 백업 JSON으로 기록을 옮기면 됩니다.</p>' +
      (storageOK ? '' : '<div class="tip" style="margin-top:12px"><span>⚠️</span><div>지금 브라우저에서는 <b>자동 저장이 제한</b>돼 있어요. 기록은 창을 닫으면 사라질 수 있으니, 위의 <b>JSON 내보내기</b>로 꼭 백업해 주세요.</div></div>') +
      '<p class="sheet-note" style="margin-top:12px">앱 정보 · 단일 HTML 파일 · 인터넷 연결 없이 동작 · 데이터는 이 기기 브라우저에만 저장</p>';

    openSheet(html);

    var file = $('importFile');
    if (file) {
      file.addEventListener('change', function () {
        var f = file.files && file.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          stageImportText(String(reader.result || ''));
        };
        reader.onerror = function () { toast('파일을 읽지 못했어요'); };
        reader.readAsText(f);
      });
    }
  }

  function saveSettings() {
    var wife = $('setWife').value.trim() || '신애';
    var husband = $('setHusband').value.trim() || '병찬';
    var due = $('setDue').value;
    var wedding = $('setWedding').value;
    if (due && !isDateStr(due)) {
      toast('출산 예정일을 다시 확인해 주세요');
      return;
    }
    if (wedding && !isDateStr(wedding)) {
      toast('결혼기념일을 다시 확인해 주세요');
      return;
    }
    state.settings.wife = wife.slice(0, 20);
    state.settings.husband = husband.slice(0, 20);
    state.settings.dueDate = due || state.settings.dueDate;
    state.settings.weddingDate = wedding || state.settings.weddingDate;
    save();
    renderAll();
    closeSheet();
    toast('설정을 저장했어요');
  }

  function clearSamples(btn) {
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.textContent = '한 번 더 누르면 예시 데이터가 지워져요';
      return;
    }
    state.diaries = state.diaries.filter(function (d) { return !d.sample; });
    state.expenses = state.expenses.filter(function (e) { return !e.sample; });
    state.prep = state.prep.filter(function (i) { return !i.sample; });
    state.places = state.places.filter(function (p) { return !p.sample; });
    save();
    renderAll();
    closeSheet();
    toast('예시 데이터를 지웠어요');
  }

  function clearAll(btn) {
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.textContent = '정말 지우려면 한 번 더 눌러 주세요';
      return;
    }
    state.diaries = [];
    state.expenses = [];
    state.prep = [];
    state.places = [];
    lastPick = null;
    pendingDelete = null;
    budgetMonth = todayStr().slice(0, 7);
    diaryFilter = 'all';
    diaryQuery = '';
    save();
    renderAll();
    closeSheet();
    toast('모든 기록을 지웠어요');
  }

  /* ---------------- toast ---------------- */

  function toast(msg) {
    var t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      t.classList.remove('show');
    }, 2400);
  }

  /* ---------------- events ---------------- */

  function setChoice(field, groupName, value) {
    var parts = field.split('.');
    if (!draft[parts[0]]) draft[parts[0]] = {};
    draft[parts[0]][parts[1]] = value;
    var group = document.querySelector('[data-group="' + groupName + '"]');
    if (!group) return;
    var buttons = group.querySelectorAll('[data-value]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('on', buttons[i].dataset.value === value);
    }
    if (field === 'expense.type') {
      var catField = $('eCatField');
      if (catField) catField.style.display = value === 'income' ? 'none' : '';
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var action = el.dataset.action;

    switch (action) {
      case 'tab':
        switchTab(el.dataset.tab);
        break;

      case 'fab':
        if (activeTab === 'diary') openDiaryForm();
        else if (activeTab === 'budget') openExpenseForm();
        else if (activeTab === 'prep') openPrepForm(null);
        else if (activeTab === 'places') openPlaceForm();
        break;

      case 'open-diary': openDiaryForm(); break;
      case 'open-expense': openExpenseForm(); break;
      case 'open-prep': openPrepForm(el.dataset.cat); break;
      case 'open-place': openPlaceForm(); break;

      case 'close-sheet':
        closeSheet();
        break;

      case 'choice':
        setChoice(el.dataset.field, el.dataset.groupName, el.dataset.value);
        break;

      case 'diary-filter':
        diaryFilter = el.dataset.value;
        renderDiary();
        break;

      case 'toggle-body': {
        var card = el.closest('.diary-card');
        if (card) {
          card.classList.toggle('open');
          el.textContent = card.classList.contains('open') ? '접기' : '더 보기';
        }
        break;
      }

      case 'del-diary':
        if (pendingDelete === el.dataset.id) deleteDiary(el.dataset.id);
        else { pendingDelete = el.dataset.id; renderDiaryList(); }
        break;

      case 'del-expense':
        if (pendingDelete === el.dataset.id) deleteExpense(el.dataset.id);
        else { pendingDelete = el.dataset.id; renderBudget(); }
        break;

      case 'del-prep':
        if (pendingDelete === el.dataset.id) deletePrep(el.dataset.id);
        else { pendingDelete = el.dataset.id; renderPrep(); }
        break;

      case 'del-place':
        if (pendingDelete === el.dataset.id) deletePlace(el.dataset.id);
        else { pendingDelete = el.dataset.id; renderPlaces(); }
        break;

      case 'save-diary': saveDiary(); break;
      case 'save-expense': saveExpense(); break;
      case 'save-prep': savePrep(); break;
      case 'save-place': savePlace(); break;
      case 'save-settings': saveSettings(); break;

      case 'toggle-prep': togglePrep(el.dataset.id); break;
      case 'toggle-visited': toggleVisited(el.dataset.id); break;

      case 'month':
        budgetMonth = shiftMonth(budgetMonth, Number(el.dataset.delta));
        pendingDelete = null;
        renderBudget();
        break;

      case 'places-tab':
        placesTab = el.dataset.value;
        lastPick = null;
        pendingDelete = null;
        renderPlaces();
        break;

      case 'random-pick': pickRandom(); break;

      case 'quick-pick':
        switchTab('places');
        pickRandom();
        break;

      case 'hide-tip':
        state.settings.tipHidden = true;
        save();
        renderHome();
        break;

      case 'open-settings': openSettings(); break;

      case 'backup-export': exportFile(); break;
      case 'backup-copy': copyText(JSON.stringify(buildBackup(), null, 2)); break;

      case 'import-file': {
        var f = $('importFile');
        if (f) f.click();
        break;
      }

      case 'import-stage': {
        var ta = $('importText');
        if (!ta || !ta.value.trim()) {
          toast('백업 JSON을 붙여넣어 주세요');
          break;
        }
        stageImportText(ta.value);
        break;
      }

      case 'import-apply': applyImport(); break;
      case 'import-cancel':
        pendingImport = null;
        renderSettings(true);
        break;

      case 'clear-samples': clearSamples(el); break;
      case 'clear-all': clearAll(el); break;

      default: break;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'diarySearch') {
      diaryQuery = e.target.value;
      renderDiaryList();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('sheetWrap').classList.contains('open')) closeSheet();
  });

  /* ---------------- boot ---------------- */

  function boot() {
    renderAll();
    switchTab('home');
    if (!storageOK) {
      setTimeout(function () { toast('자동 저장이 제한된 환경이에요. 설정에서 JSON 백업을 써 주세요.'); }, 900);
    }
    window.__ourHome = {
      version: 1,
      getState: function () { return state; },
      backup: buildBackup,
      importText: stageImportText,
      applyImport: applyImport,
      pickRandom: pickRandom,
      seed: seedState
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
<script>
/* ---------- 첫 화면 잠금 (4자리 비밀번호) ----------
   비밀번호는 평문으로 두지 않고 SHA-256 해시로만 비교합니다.
   해시는 이 기기 브라우저(localStorage)에만 저장되며, 바꾸면 그 해시로 대체됩니다. */
(function () {
  'use strict';

  var STORE_KEY = 'ourhome.lock.v1';
  var SESSION_KEY = 'ourhome.lock.session.v1';
  var DEFAULT_HASH = 'e9ab39f01d431c5250493a3dc493bba9c43f73a4461c72b5135ee09738582af7';

  var entered = '';
  var busy = false;
  var fails = 0;
  var cooldownUntil = 0;

  /* ---------------- SHA-256 ---------------- */

  function rr(x, n) { return (x >>> n) | (x << (32 - n)); }

  function utf8Bytes(str) {
    var out = [], i, c, c2, cp;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) {
        out.push(c);
      } else if (c < 0x800) {
        out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      } else {
        c2 = (i + 1 < str.length) ? str.charCodeAt(i + 1) : 0;
        if (c >= 0xd800 && c <= 0xdbff && c2 >= 0xdc00 && c2 <= 0xdfff) {
          cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
          out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
          i++;
        } else {
          out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
        }
      }
    }
    return out;
  }

  var SHA_K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  function sha256Hex(str) {
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var bytes = utf8Bytes(String(str));
    var len = bytes.length;
    var w = new Array(64);
    var i, t, off, s0, s1, S0, S1, ch, maj, t1, t2, a, b, c, d, e, f, g, h, hi, lo, bitLen;

    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bitLen = len * 8;
    hi = Math.floor(bitLen / 4294967296);
    lo = bitLen >>> 0;
    bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255,
               (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);

    for (off = 0; off < bytes.length; off += 64) {
      for (t = 0; t < 16; t++) {
        w[t] = (bytes[off + t * 4] << 24) | (bytes[off + t * 4 + 1] << 16) | (bytes[off + t * 4 + 2] << 8) | bytes[off + t * 4 + 3];
      }
      for (t = 16; t < 64; t++) {
        s0 = (rr(w[t - 15], 7) ^ rr(w[t - 15], 18) ^ (w[t - 15] >>> 3));
        s1 = (rr(w[t - 2], 17) ^ rr(w[t - 2], 19) ^ (w[t - 2] >>> 10));
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
      }
      a = H[0]; b = H[1]; c = H[2]; d = H[3]; e = H[4]; f = H[5]; g = H[6]; h = H[7];
      for (t = 0; t < 64; t++) {
        S1 = (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25));
        ch = (e & f) ^ (~e & g);
        t1 = (h + S1 + ch + SHA_K[t] + w[t]) | 0;
        S0 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22));
        maj = (a & b) ^ (a & c) ^ (b & c);
        t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }

    var out = '', k;
    for (i = 0; i < 8; i++) {
      k = (H[i] >>> 0).toString(16);
      while (k.length < 8) k = '0' + k;
      out += k;
    }
    return out;
  }

  function sha256HexAsync(str) {
    try {
      if (window.crypto && window.crypto.subtle && window.TextEncoder && window.Promise) {
        return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str))).then(function (buf) {
          var b = new Uint8Array(buf), s = '', i, hx;
          for (i = 0; i < b.length; i++) {
            hx = b[i].toString(16);
            s += hx.length < 2 ? '0' + hx : hx;
          }
          return s;
        })['catch'](function () { return sha256Hex(str); });
      }
    } catch (e) { /* 아래 폴백 사용 */ }
    try {
      return Promise.resolve(sha256Hex(str));
    } catch (e2) {
      return { then: function (fn) { fn(sha256Hex(str)); } };
    }
  }

  /* ---------------- 저장 ---------------- */

  function getStoredHash() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o.hash === 'string' && /^[0-9a-f]{64}$/.test(o.hash)) return o.hash;
      }
    } catch (e) { /* 저장소를 못 쓰면 기본 값 */ }
    return DEFAULT_HASH;
  }

  function setStoredHash(hash) {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, hash: hash }));
      return true;
    } catch (e) { return false; }
  }

  /* ---------------- 잠금 화면 ---------------- */

  var dotsEl = document.getElementById('lockDots');
  var msgEl = document.getElementById('lockMsg');
  var padEl = document.getElementById('lockPad');

  function renderDots() {
    if (!dotsEl) return;
    var list = dotsEl.getElementsByTagName('span'), i;
    for (i = 0; i < list.length; i++) {
      list[i].className = i < entered.length ? 'on' : '';
    }
  }

  function setMsg(text) { if (msgEl) msgEl.textContent = text || ''; }

  function setPadDisabled(flag) {
    if (!padEl) return;
    var btns = padEl.getElementsByTagName('button'), i;
    for (i = 0; i < btns.length; i++) {
      if (flag) btns[i].setAttribute('disabled', 'disabled');
      else btns[i].removeAttribute('disabled');
    }
  }

  function unlock() {
    entered = '';
    renderDots();
    setMsg('');
    document.body.classList.remove('locked');
    try { window.sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) { /* 무시 */ }
  }

  function lockNow() {
    entered = '';
    fails = 0;
    renderDots();
    setMsg('');
    document.body.classList.add('locked');
    try { window.sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* 무시 */ }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function checkPin() {
    busy = true;
    setPadDisabled(true);
    var guess = entered;
    sha256HexAsync(guess).then(function (hash) {
      if (hash === getStoredHash()) {
        fails = 0;
        busy = false;
        setPadDisabled(false);
        unlock();
        return;
      }
      fails++;
      entered = '';
      renderDots();
      if (fails >= 5) {
        cooldownUntil = Date.now() + 10000;
        setMsg('잠시 후 다시 시도해 주세요');
      } else {
        setMsg('비밀번호가 맞지 않아요');
      }
      if (dotsEl) {
        dotsEl.className = 'lock-dots lock-shake';
        setTimeout(function () { dotsEl.className = 'lock-dots'; }, 380);
      }
      busy = false;
      setPadDisabled(false);
    });
  }

  function press(key) {
    if (busy) return;
    if (Date.now() < cooldownUntil) return;
    if (key === 'del') {
      entered = entered.slice(0, -1);
      setMsg('');
      renderDots();
      return;
    }
    if (!/^\d$/.test(key || '')) return;
    if (entered.length >= 4) return;
    entered += key;
    setMsg('');
    renderDots();
    if (entered.length === 4) checkPin();
  }

  function closestButton(node) {
    while (node && node !== document) {
      if (node.tagName && node.tagName.toLowerCase() === 'button') return node;
      node = node.parentNode;
    }
    return null;
  }

  if (padEl) {
    padEl.addEventListener('click', function (e) {
      var btn = closestButton(e.target);
      if (!btn || !btn.getAttribute) return;
      var key = btn.getAttribute('data-key');
      if (key) press(key);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('locked')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key && /^\d$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
  });

  try {
    if (window.sessionStorage.getItem(SESSION_KEY) === '1') document.body.classList.remove('locked');
  } catch (e) { /* 무시 */ }

  /* ---------------- 설정: 비밀번호 변경 ---------------- */

  function pinCardHtml() {
    return '<hr class="divider">' +
      '<p class="set-title">🔒 잠금 비밀번호</p>' +
      '<p class="set-desc">이 앱을 열 때 쓰는 숫자 4자리 비밀번호를 바꿀 수 있어요. 바꾼 비밀번호는 이 기기에만 저장됩니다.</p>' +
      '<div class="field-row">' +
        '<div class="field"><label for="pinOld">지금 비밀번호</label><input type="password" id="pinOld" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div>' +
        '<div class="field"><label for="pinNew">새 비밀번호</label><input type="password" id="pinNew" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div>' +
      '</div>' +
      '<div class="field"><label for="pinNew2">새 비밀번호 한 번 더</label><input type="password" id="pinNew2" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div>' +
      '<p id="pinMsg" role="status" aria-live="polite"></p>' +
      '<button class="primary-btn" id="pinChangeBtn" type="button">비밀번호 변경</button>' +
      '<button class="ghost-btn" id="pinLockBtn" type="button">🔒 지금 잠그기</button>';
  }

  function changePin() {
    var o = document.getElementById('pinOld');
    var n = document.getElementById('pinNew');
    var n2 = document.getElementById('pinNew2');
    var msg = document.getElementById('pinMsg');
    if (!o || !n || !n2) return;
    function say(t) { if (msg) msg.textContent = t || ''; }
    var ov = String(o.value || '').replace(/\D/g, '');
    var nv = String(n.value || '').replace(/\D/g, '');
    var n2v = String(n2.value || '').replace(/\D/g, '');
    if (ov.length !== 4) { say('지금 비밀번호 4자리를 입력해 주세요'); return; }
    if (nv.length !== 4) { say('새 비밀번호는 숫자 4자리로 정해 주세요'); return; }
    if (nv !== n2v) { say('새 비밀번호 두 개가 서로 달라요'); return; }
    if (nv === ov) { say('지금과 다른 번호로 정해 주세요'); return; }
    say('확인 중…');
    sha256HexAsync(ov).then(function (oldHash) {
      if (oldHash !== getStoredHash()) { say('지금 비밀번호가 맞지 않아요'); return; }
      return sha256HexAsync(nv).then(function (newHash) {
        if (setStoredHash(newHash)) {
          o.value = ''; n.value = ''; n2.value = '';
          say('비밀번호를 바꿨어요 ✅');
          setTimeout(function () { if (msg && msg.textContent.indexOf('바꿨어요') !== -1) say(''); }, 2600);
        } else {
          say('이 브라우저에서는 저장이 안 돼요. 백업 JSON을 확인해 주세요');
        }
      });
    });
  }

  function bindPinCard() {
    var changeBtn = document.getElementById('pinChangeBtn');
    if (changeBtn) changeBtn.addEventListener('click', changePin);
    var lockBtn = document.getElementById('pinLockBtn');
    if (lockBtn) {
      lockBtn.addEventListener('click', function () {
        var close = document.querySelector('#sheet .close-btn');
        if (close) close.click();
        lockNow();
      });
    }
    ['pinOld', 'pinNew', 'pinNew2'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', function () { el.value = String(el.value || '').replace(/\D/g, '').slice(0, 4); });
    });
  }

  function injectPinCard() {
    var wrap = document.getElementById('sheetWrap');
    var sheet = document.getElementById('sheet');
    if (!wrap || !sheet) return;
    if (!wrap.classList.contains('open')) return;
    if (document.getElementById('pinCard')) return;
    var head = sheet.querySelector('.sheet-head h2');
    if (!head || String(head.textContent).indexOf('설정') === -1) return;
    var card = document.createElement('div');
    card.id = 'pinCard';
    card.innerHTML = pinCardHtml();
    sheet.appendChild(card);
    bindPinCard();
  }

  if (window.MutationObserver) {
    var sheetWrapEl = document.getElementById('sheetWrap');
    if (sheetWrapEl) {
      new MutationObserver(injectPinCard).observe(sheetWrapEl, {
        attributes: true, attributeFilter: ['class'], childList: true, subtree: true
      });
    }
  }

  /* 테스트·디버그용 (비밀번호 자체는 내보내지 않습니다) */
  window.__ourHomeLock = {
    isLocked: function () { return document.body.classList.contains('locked'); },
    lock: lockNow,
    sha256Hex: sha256Hex,
    submit: function (pin) { entered = ''; renderDots(); press(String(pin).charAt(0)); press(String(pin).charAt(1)); press(String(pin).charAt(2)); press(String(pin).charAt(3)); }
  };
})();
</script>
</body>
</html>
